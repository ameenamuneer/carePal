<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePAL Live AI API Tester</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f5f7fa; color: #333; }
        h1 { color: #2c3e50; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 10px; margin-bottom: 10px; }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        button.danger { background: #e74c3c; }
        button.danger:hover { background: #c0392b; }
        .media-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .video-box { flex: 1; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 200px; }
        video { width: 100%; height: auto; display: block; }
        #logs { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; height: 300px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; font-size: 13px; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #34495e; padding-bottom: 5px; }
        .log-in { color: #2ecc71; }
        .log-out { color: #3498db; }
        .log-error { color: #e74c3c; }
        .log-sys { color: #f1c40f; }
        .controls { display: flex; flex-wrap: wrap; }
    </style>
</head>
<body>

    <h1>CarePAL Live AI Web Tester</h1>

    <div class="card">
        <h3>Connection Settings</h3>
        <div class="form-group">
            <label for="wsUrl">WebSocket Host URL</label>
            <input type="text" id="wsUrl" value="ws://localhost:8000" placeholder="ws://localhost:8000">
        </div>
        <div class="form-group">
            <label for="jwtToken">JWT Auth Token</label>
            <input type="text" id="jwtToken" placeholder="Paste your Access Token here...">
        </div>
        <div>
            <button id="btnConnect">Connect to AI</button>
            <button id="btnDisconnect" class="danger" disabled>Disconnect</button>
        </div>
    </div>

    <div class="card">
        <h3>Media Controls & View</h3>
        <div class="controls">
            <button id="btnStartCamera">Start Camera</button>
            <button id="btnStopCamera" class="danger" disabled>Stop Camera</button>
            <button id="btnStartMic">Start Mic</button>
            <button id="btnStopMic" class="danger" disabled>Stop Mic</button>
        </div>
        <div class="media-container">
            <div class="video-box">
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
        </div>
        <!-- Hidden Canvas for capturing frames -->
        <canvas id="hiddenCanvas" style="display:none;"></canvas>
    </div>

    <div class="card">
        <h3>Manual Controls</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="txtInput" placeholder="Type a message to the AI..." style="flex:1;">
            <button id="btnSendText">Send Text</button>
        </div>
    </div>

    <div class="card">
        <h3>Logs & AI Responses</h3>
        <div id="logs"></div>
    </div>

    <script>
        // DOM Elements
        const elWsUrl = document.getElementById('wsUrl');
        const elJwtToken = document.getElementById('jwtToken');
        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const btnStartCamera = document.getElementById('btnStartCamera');
        const btnStopCamera = document.getElementById('btnStopCamera');
        const btnStartMic = document.getElementById('btnStartMic');
        const btnStopMic = document.getElementById('btnStopMic');
        const txtInput = document.getElementById('txtInput');
        const btnSendText = document.getElementById('btnSendText');
        const elVideo = document.getElementById('localVideo');
        const elCanvas = document.getElementById('hiddenCanvas');
        const elLogs = document.getElementById('logs');
        const ctxCanvas = elCanvas.getContext('2d');

        // State variables
        let ws = null;
        let videoStream = null;
        let audioStream = null;
        let audioContext = null;
        let audioProcessor = null;
        let audioSource = null;
        let frameInterval = null;
        
        // Playback variables
        let playbackContext = null;
        let nextPlayTime = 0;

        function logInfo(msg, type='log-sys') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${msg}`;
            elLogs.appendChild(entry);
            elLogs.scrollTop = elLogs.scrollHeight;
        }

        // --- WEBSOCKET CONNECTION ---
        btnConnect.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            
            let host = elWsUrl.value.trim();
            if(host.endsWith('/')) host = host.slice(0,-1);
            
            const token = elJwtToken.value.trim();
            const wsUrl = `${host}/ws/agent/live/?token=${encodeURIComponent(token)}`;
            
            logInfo(`Connecting to ${wsUrl}...`);
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                logInfo('WebSocket Connected!', 'log-sys');
                btnConnect.disabled = true;
                btnDisconnect.disabled = false;
                
                // Init playback context on user interaction
                if(!playbackContext) {
                    playbackContext = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 24000}); // Gemini uses 24kHz output
                } else if (playbackContext.state === 'suspended') {
                    playbackContext.resume();
                }
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleIncomingMessage(data);
                } catch (e) {
                    logInfo(`Error parsing message: ${e.message}`, 'log-error');
                }
            };
            
            ws.onerror = (error) => {
                logInfo('WebSocket Error', 'log-error');
                console.error(error);
            };
            
            ws.onclose = (event) => {
                logInfo(`WebSocket Closed (Code: ${event.code})`, 'log-error');
                btnConnect.disabled = false;
                btnDisconnect.disabled = true;
                stopAllMedia();
            };
        });

        btnDisconnect.addEventListener('click', () => {
            if (ws) ws.close();
        });

        function handleIncomingMessage(msg) {
            if (msg.error) {
                logInfo(`Error: ${msg.error}`, 'log-error');
                return;
            }
            
            switch (msg.type) {
                case 'text':
                    logInfo(`AI: ${msg.content}`, 'log-in');
                    break;
                case 'camera_control':
                    logInfo(`COMMAND: Adjust camera by pan_delta ${msg.pan_delta} degrees`, 'log-sys');
                    break;
                case 'audio':
                    playBase64Audio(msg.data);
                    break;
                default:
                    logInfo(`Received unknown type: ${msg.type}`, 'log-sys');
            }
        }

        // --- AUDIO PLAYBACK (PCM 16-bit to Web Audio) ---
        function playBase64Audio(base64Str) {
            if (!playbackContext) return;
            
            // Decode base64 to binary string
            const binaryString = window.atob(base64Str);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            // Gemini native audio is typically 24kHz 16-bit PCM for output
            // Read 16-bit PCM into Float32
            const int16View = new Int16Array(bytes.buffer);
            const floatArray = new Float32Array(int16View.length);
            for (let i = 0; i < int16View.length; i++) {
                floatArray[i] = int16View[i] / 32768.0; 
            }
            
            const audioBuffer = playbackContext.createBuffer(1, floatArray.length, 24000);
            audioBuffer.getChannelData(0).set(floatArray);
            
            const source = playbackContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(playbackContext.destination);
            
            const currentTime = playbackContext.currentTime;
            if (nextPlayTime < currentTime) {
                nextPlayTime = currentTime;
            }
            source.start(nextPlayTime);
            nextPlayTime += audioBuffer.duration;
        }


        // --- SEND TEXT ---
        btnSendText.addEventListener('click', () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                logInfo("Not connected", 'log-error');
                return;
            }
            const text = txtInput.value.trim();
            if (text) {
                ws.send(JSON.stringify({ type: 'text', data: text }));
                logInfo(`You: ${text}`, 'log-out');
                txtInput.value = '';
            }
        });


        // --- MICROPHONE CAPTURE (16kHz PCM) ---
        var downsampleBuffer = function (buffer, sampleRate, outSampleRate) {
            if (outSampleRate == sampleRate) {
                return buffer;
            }
            if (outSampleRate > sampleRate) {
                throw "downsampling rate show be smaller than original sample rate";
            }
            var sampleRateRatio = sampleRate / outSampleRate;
            var newLength = Math.round(buffer.length / sampleRateRatio);
            var result = new Int16Array(newLength);
            var offsetResult = 0;
            var offsetBuffer = 0;
            while (offsetResult < result.length) {
                var nextOffsetBuffer = Math.round((offsetResult + 1) * sampleRateRatio);
                var accum = 0, count = 0;
                for (var i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
                    accum += buffer[i];
                    count++;
                }
                result[offsetResult] = Math.min(1, Math.max(-1, accum / count)) * 32767;
                offsetResult++;
                offsetBuffer = nextOffsetBuffer;
            }
            return result;
        };

        btnStartMic.addEventListener('click', async () => {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                
                audioSource = audioContext.createMediaStreamSource(audioStream);
                // ScriptProcessor is deprecated but easiest for vanilla JS raw PCM access without extra files
                audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);
                
                audioProcessor.onaudioprocess = (e) => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    
                    const inputData = e.inputBuffer.getChannelData(0);
                    // Convert Float32 to Int16
                    const pcm16 = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 32767;
                    }
                    
                    // Base64 encode the Int16Array buffer
                    const uint8 = new Uint8Array(pcm16.buffer);
                    let binary = '';
                    for (let i = 0; i < uint8.byteLength; i++) {
                        binary += String.fromCharCode(uint8[i]);
                    }
                    const base64Str = window.btoa(binary);
                    
                    ws.send(JSON.stringify({
                        type: 'audio',
                        mime_type: 'audio/pcm;rate=16000',
                        data: base64Str
                    }));
                };
                
                audioSource.connect(audioProcessor);
                audioProcessor.connect(audioContext.destination);
                
                logInfo('Microphone started.', 'log-sys');
                btnStartMic.disabled = true;
                btnStopMic.disabled = false;
            } catch (err) {
                logInfo(`Mic error: ${err.message}`, 'log-error');
            }
        });

        btnStopMic.addEventListener('click', stopMic);

        function stopMic() {
            if (audioStream) {
                audioStream.getTracks().forEach(t => t.stop());
                audioStream = null;
            }
            if (audioProcessor) {
                audioProcessor.disconnect();
                audioProcessor = null;
            }
            if (audioSource) {
                audioSource.disconnect();
                audioSource = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            btnStartMic.disabled = false;
            btnStopMic.disabled = true;
            logInfo('Microphone stopped.', 'log-sys');
        }


        // --- CAMERA CAPTURE (1fps JPEG) ---
        btnStartCamera.addEventListener('click', async () => {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                elVideo.srcObject = videoStream;
                
                // Wait for video metadata to set canvas size
                elVideo.onloadedmetadata = () => {
                    elCanvas.width = elVideo.videoWidth;
                    elCanvas.height = elVideo.videoHeight;
                    
                    // Capture frames at 1 frame per second
                    frameInterval = setInterval(captureAndSendFrame, 1000);
                    logInfo('Camera started (1fps streaming).', 'log-sys');
                };
                
                btnStartCamera.disabled = true;
                btnStopCamera.disabled = false;
            } catch (err) {
                logInfo(`Camera error: ${err.message}`, 'log-error');
            }
        });

        btnStopCamera.addEventListener('click', stopCamera);

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
                elVideo.srcObject = null;
            }
            if (frameInterval) {
                clearInterval(frameInterval);
                frameInterval = null;
            }
            btnStartCamera.disabled = false;
            btnStopCamera.disabled = true;
            logInfo('Camera stopped.', 'log-sys');
        }

        function captureAndSendFrame() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (!elVideo.videoWidth) return;
            
            // Draw video to canvas
            ctxCanvas.drawImage(elVideo, 0, 0, elCanvas.width, elCanvas.height);
            // Get JPEG base64
            const dataUrl = elCanvas.toDataURL('image/jpeg', 0.8);
            // Remove 'data:image/jpeg;base64,'
            const base64Str = dataUrl.split(',')[1];
            
            ws.send(JSON.stringify({
                type: 'image',
                mime_type: 'image/jpeg',
                data: base64Str
            }));
        }

        function stopAllMedia() {
            stopMic();
            stopCamera();
        }
    </script>
</body>
</html>
