<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePAL Live AI API Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }

        h1 {
            color: #2c3e50;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            background: #2980b9;
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        button.success {
            background: #2ecc71;
        }

        button.danger {
            background: #e74c3c;
        }

        button.danger:hover {
            background: #c0392b;
        }

        .media-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-box {
            flex: 1;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        #logs {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 13px;
        }

        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid #34495e;
            padding-bottom: 5px;
        }

        .log-in {
            color: #2ecc71;
        }

        .log-out {
            color: #3498db;
        }

        .log-error {
            color: #e74c3c;
        }

        .log-sys {
            color: #f1c40f;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
        }

        body.immersive-mode {
            background: #000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body.immersive-mode>h1,
        body.immersive-mode>.card:not(#media-card),
        body.immersive-mode .controls,
        body.immersive-mode h3 {
            display: none !important;
        }

        body.immersive-mode #media-card {
            background: #000;
            box-shadow: none;
            padding: 0;
            margin: 0;
            border-radius: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        body.immersive-mode .media-container {
            flex: 1;
            margin: 0;
            display: flex;
        }

        body.immersive-mode .video-box {
            border-radius: 0;
            background: #000;
            width: 100%;
            height: 100%;
        }

        body.immersive-mode video {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <h1>CarePAL Live AI Web Tester</h1>

    <div class="card">
        <h3>1. Authentication</h3>
        <div class="form-group">
            <label>Backend API Base URL</label>
            <input type="text" id="apiBaseUrl" value="https://backend.hellocarepal.com">
        </div>
        <div class="row">
            <div style="flex: 1;">
                <label>Username</label>
                <input type="text" id="loginUser" value="isa">
            </div>
            <div style="flex: 1;">
                <label>Password</label>
                <input type="password" id="loginPass" value="passme123">
            </div>
        </div>
        <button id="btnLogin" class="success">Login & Get Token</button>
    </div>

    <div class="card">
        <h3>2. Connection Settings</h3>
        <div class="form-group">
            <label for="wsUrl">WebSocket Host URL</label>
            <input type="text" id="wsUrl" value="wss://backend.hellocarepal.com"
                placeholder="wss://backend.hellocarepal.com">
        </div>
        <div class="form-group">
            <label for="jwtToken">JWT Auth Token</label>
            <input type="text" id="jwtToken" placeholder="Login above to auto-fill or paste manually...">
        </div>
        <div>
            <button id="btnConnect">Connect to AI</button>
            <button id="btnDisconnect" class="danger" disabled>Disconnect</button>
        </div>
    </div>

    <div class="card" id="media-card">
        <h3>Media Controls & View</h3>
        <div class="controls">
            <button id="btnStartCamera">Start Camera</button>
            <button id="btnStopCamera" class="danger" disabled>Stop Camera</button>
            <button id="btnStartMic">Start Mic</button>
            <button id="btnStopMic" class="danger" disabled>Stop Mic</button>
        </div>
        <div class="media-container">
            <div class="video-box">
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
        </div>
        <canvas id="hiddenCanvas" style="display:none;"></canvas>
    </div>

    <div class="card">
        <h3>Manual Controls</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="txtInput" placeholder="Type a message to the AI..." style="flex:1;">
            <button id="btnSendText">Send Text</button>
        </div>
    </div>

    <div class="card">
        <h3>Logs & AI Responses</h3>
        <div id="logs"></div>
    </div>

    <script>
        // DOM Elements
        const elApiBase = document.getElementById('apiBaseUrl');
        const elLoginUser = document.getElementById('loginUser');
        const elLoginPass = document.getElementById('loginPass');
        const btnLogin = document.getElementById('btnLogin');

        const elWsUrl = document.getElementById('wsUrl');
        const elJwtToken = document.getElementById('jwtToken');
        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const btnStartCamera = document.getElementById('btnStartCamera');
        const btnStopCamera = document.getElementById('btnStopCamera');
        const btnStartMic = document.getElementById('btnStartMic');
        const btnStopMic = document.getElementById('btnStopMic');
        const txtInput = document.getElementById('txtInput');
        const btnSendText = document.getElementById('btnSendText');
        const elVideo = document.getElementById('localVideo');
        const elCanvas = document.getElementById('hiddenCanvas');
        const elLogs = document.getElementById('logs');
        const ctxCanvas = elCanvas.getContext('2d');

        // State
        let ws = null;
        let videoStream = null;
        let audioStream = null;
        let audioContext = null;
        let audioProcessor = null;
        let audioSource = null;
        let frameInterval = null;
        let playbackContext = null;
        let nextPlayTime = 0;

        function logInfo(msg, type = 'log-sys') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${msg}`;
            elLogs.appendChild(entry);
            elLogs.scrollTop = elLogs.scrollHeight;
        }

        // --- NEW LOGIN LOGIC ---
        btnLogin.addEventListener('click', async () => {
            const baseUrl = elApiBase.value.trim();
            const username = elLoginUser.value.trim();
            const password = elLoginPass.value.trim();

            logInfo(`Attempting login for user: ${username}...`);

            try {
                const response = await fetch(`${baseUrl}/api/v1/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                const token = data.tokens?.access;

                if (token) {
                    elJwtToken.value = token;
                    logInfo('Login Successful! Token updated.', 'log-in');
                } else {
                    throw new Error('Token not found in response');
                }
            } catch (err) {
                logInfo(`Login failed: ${err.message}`, 'log-error');
            }
        });

        // --- WEBSOCKET CONNECTION ---
        btnConnect.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            let host = elWsUrl.value.trim();
            const token = elJwtToken.value.trim();

            if (!token) {
                logInfo("Error: Please login or enter a token first", 'log-error');
                return;
            }

            const wsUrl = `${host}/ws/agent/live/?token=${encodeURIComponent(token)}`;

            logInfo(`Connecting to ${wsUrl}...`);
            ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";

            ws.onopen = () => {
                logInfo('WebSocket Connected!', 'log-sys');
                btnConnect.disabled = true;
                btnDisconnect.disabled = false;
                if (!playbackContext) {
                    playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                } else if (playbackContext.state === 'suspended') {
                    playbackContext.resume();
                }
            };

            ws.onmessage = (event) => {
                try {
                    if (event.data instanceof ArrayBuffer) {
                        const buffer = event.data;
                        const dataView = new DataView(buffer);
                        const typeByte = dataView.getUint8(0);
                        const payloadBuffer = buffer.slice(1);

                        if (typeByte === 0x00) playBinaryAudio(payloadBuffer);
                        else if (typeByte === 0x02) handleIncomingJson(JSON.parse(new TextDecoder().decode(payloadBuffer)));
                        else if (typeByte === 0x03) handleInterrupt();
                    } else {
                        handleIncomingJson(JSON.parse(event.data));
                    }
                } catch (e) { console.error(e); }
            };

            ws.onclose = (event) => {
                logInfo(`WebSocket Closed (Code: ${event.code})`, 'log-error');
                btnConnect.disabled = false;
                btnDisconnect.disabled = true;
                stopAllMedia();
            };
        });

        // --- REST OF YOUR ORIGINAL LOGIC (Unchanged) ---
        btnDisconnect.addEventListener('click', () => ws && ws.close());

        function handleInterrupt() {
            logInfo(`--- INTERRUPT ---`, 'log-error');
            if (playbackContext) {
                playbackContext.close().then(() => {
                    playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                    nextPlayTime = 0;
                });
            }
        }

        function handleIncomingJson(msg) {
            if (msg.type === 'text') logInfo(`AI: ${msg.content}`, 'log-in');
            else if (msg.type === 'camera_control') logInfo(`CMD: Pan ${msg.pan_delta}`, 'log-sys');
        }

        function playBinaryAudio(payloadBuffer) {
            if (!playbackContext) return;
            const int16View = new Int16Array(payloadBuffer.byteLength % 2 === 0 ? payloadBuffer : payloadBuffer.slice(0, -1));
            const floatArray = new Float32Array(int16View.length);
            for (let i = 0; i < int16View.length; i++) floatArray[i] = int16View[i] / 32768.0;

            const audioBuffer = playbackContext.createBuffer(1, floatArray.length, 24000);
            audioBuffer.getChannelData(0).set(floatArray);
            const source = playbackContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(playbackContext.destination);
            const now = playbackContext.currentTime;
            if (nextPlayTime < now) nextPlayTime = now;
            source.start(nextPlayTime);
            nextPlayTime += audioBuffer.duration;
        }

        btnSendText.addEventListener('click', () => {
            const text = txtInput.value.trim();
            if (text && ws?.readyState === WebSocket.OPEN) {
                const jsonBytes = new TextEncoder().encode(JSON.stringify({ type: 'text', data: text }));
                const payload = new Uint8Array(1 + jsonBytes.length);
                payload[0] = 0x02; payload.set(jsonBytes, 1);
                ws.send(payload.buffer);
                logInfo(`You: ${text}`, 'log-out');
                txtInput.value = '';
            }
        });

        btnStartMic.addEventListener('click', async () => {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext({ sampleRate: 16000 });
                audioSource = audioContext.createMediaStreamSource(audioStream);
                audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);
                audioProcessor.onaudioprocess = (e) => {
                    if (ws?.readyState !== WebSocket.OPEN) return;
                    const input = e.inputBuffer.getChannelData(0);
                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 32767;
                    const payload = new Uint8Array(1 + pcm16.buffer.byteLength);
                    payload[0] = 0x00; payload.set(new Uint8Array(pcm16.buffer), 1);
                    ws.send(payload.buffer);
                };
                audioSource.connect(audioProcessor);
                audioProcessor.connect(audioContext.destination);
                btnStartMic.disabled = true; btnStopMic.disabled = false;
            } catch (err) { logInfo(err.message, 'log-error'); }
        });

        btnStopMic.addEventListener('click', () => {
            if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            btnStartMic.disabled = false; btnStopMic.disabled = true;
        });

        btnStartCamera.addEventListener('click', async () => {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                elVideo.srcObject = videoStream;
                elVideo.onloadedmetadata = () => {
                    elCanvas.width = elVideo.videoWidth; elCanvas.height = elVideo.videoHeight;
                    frameInterval = setInterval(() => {
                        if (ws?.readyState !== WebSocket.OPEN) return;
                        ctxCanvas.drawImage(elVideo, 0, 0, elCanvas.width, elCanvas.height);
                        elCanvas.toBlob((blob) => {
                            blob.arrayBuffer().then(ab => {
                                const payload = new Uint8Array(1 + ab.byteLength);
                                payload[0] = 0x01; payload.set(new Uint8Array(ab), 1);
                                ws.send(payload.buffer);
                            });
                        }, 'image/jpeg', 0.8);
                    }, 1000);
                };
                btnStartCamera.disabled = true; btnStopCamera.disabled = false;
            } catch (err) { logInfo(err.message, 'log-error'); }
        });

        btnStopCamera.addEventListener('click', () => {
            if (videoStream) videoStream.getTracks().forEach(t => t.stop());
            clearInterval(frameInterval);
            btnStartCamera.disabled = false; btnStopCamera.disabled = true;
        });

        function stopAllMedia() {
            if (videoStream) videoStream.getTracks().forEach(t => t.stop());
            if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            clearInterval(frameInterval);
        }

        window.startSession = function (token, wsUrl) {
            document.body.classList.add('immersive-mode');
            if (token) {
                elJwtToken.value = token;
            }
            if (wsUrl) {
                elWsUrl.value = wsUrl;
            }
            // Auto connect a bit after load
            setTimeout(() => {
                btnConnect.click();
            }, 500);

            // Auto start media after connection delay
            setTimeout(() => {
                btnStartCamera.click();
                btnStartMic.click();
            }, 1000);
        };
    </script>
</body>

</html>
