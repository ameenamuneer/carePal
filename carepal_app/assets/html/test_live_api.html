<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #d4ecf7;
            font-family: 'Syne', sans-serif
        }

        canvas#bg {
            position: fixed;
            inset: 0;
            z-index: 0
        }

        #app {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none
        }

        #orb-wrap {
            position: relative;
            width: min(52vw, 52vh);
            height: min(52vw, 52vh)
        }

        canvas#drop {
            width: 100%;
            height: 100%;
            display: block
        }

        #status {
            margin-top: 3vh;
            font-size: clamp(.72rem, 1.7vw, .95rem);
            font-weight: 300;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: rgba(60, 120, 190, .65);
            min-height: 1.5em;
            transition: color .6s, opacity .4s
        }

        #status.speak {
            color: rgba(30, 165, 90, .8)
        }

        #ticker {
            position: fixed;
            bottom: 12vh;
            left: 50%;
            transform: translateX(-50%);
            width: min(86vw, 580px);
            text-align: center;
            font-size: clamp(.68rem, 1.3vw, .88rem);
            font-weight: 300;
            letter-spacing: .06em;
            color: rgba(50, 110, 175, .65);
            line-height: 1.75;
            min-height: 2.4em;
            transition: color .4s
        }

        #ticker.ai {
            color: rgba(25, 155, 85, .8)
        }

        #controls {
            position: fixed;
            bottom: 4vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            pointer-events: all
        }

        .cbtn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(100, 170, 230, .3);
            background: rgba(255, 255, 255, .28);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: rgba(50, 110, 190, .75);
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .25s;
            box-shadow: 0 4px 14px rgba(80, 150, 220, .12)
        }

        .cbtn:hover {
            background: rgba(255, 255, 255, .42);
            border-color: rgba(100, 190, 255, .55)
        }

        .cbtn.on {
            border-color: rgba(60, 190, 110, .55);
            color: rgba(30, 155, 85, .9);
            background: rgba(180, 245, 210, .22)
        }

        .cbtn.danger {
            border-color: rgba(220, 80, 80, .35);
            color: rgba(200, 50, 50, .7)
        }

        #cam-box {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 148px;
            height: 110px;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(190, 220, 240, .25);
            border: 1px solid rgba(140, 195, 240, .3);
            backdrop-filter: blur(10px);
            transition: opacity .35s, transform .35s;
            box-shadow: 0 6px 28px rgba(70, 130, 210, .12)
        }

        #cam-box.hide {
            opacity: 0;
            transform: scale(.88);
            pointer-events: none
        }

        #cam-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block
        }

        #cam-box::after {
            content: '● live';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 3px 0;
            font-size: .52rem;
            letter-spacing: .13em;
            color: rgba(50, 120, 200, .65);
            background: linear-gradient(transparent, rgba(210, 235, 250, .55))
        }

        #conn {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(160, 190, 215, .5);
            transition: all .45s
        }

        #conn.on {
            background: rgba(50, 200, 110, 1);
            box-shadow: 0 0 7px rgba(50, 200, 110, .55)
        }

        #hiddenCanvas {
            display: none
        }
    </style>
</head>

<body>
    <canvas id="bg"></canvas>
    <div id="conn"></div>
    <div id="app">
        <div id="orb-wrap"><canvas id="drop"></canvas></div>
        <div id="status">awaiting connection</div>
    </div>
    <div id="ticker"></div>
    <div id="cam-box" class="hide"><video id="localVideo" autoplay playsinline muted></video></div>
    <div id="controls">
        <button class="cbtn" id="btnMic">🎙</button>
        <button class="cbtn" id="btnCam">📷</button>
        <button class="cbtn danger" id="btnEnd" onclick="ws&&ws.close()">✕</button>
    </div>
    <canvas id="hiddenCanvas"></canvas>
    <script>
        // ── BACKGROUND ───────────────────────────────────────────────────────
        const bgC = document.getElementById('bg');
        const bgX = bgC.getContext('2d');
        function resizeBg() { bgC.width = innerWidth; bgC.height = innerHeight }
        function drawBg(ct) {
            const w = bgC.width, h = bgC.height;
            const s = Math.sin(ct * .0004), c2 = Math.cos(ct * .0003);
            const ox = s * w * .06, oy = c2 * h * .06;
            let g;
            if (colorT > .5) {
                const bl = ctx2lerp(colorT, .5, 1);
                g = bgX.createRadialGradient(w * .5 + ox, h * .45 + oy, 0, w * .5, h * .5, w * .75);
                g.addColorStop(0, lerpRgba([205, 245, 220], [210, 235, 250], bl, 1));
                g.addColorStop(.5, lerpRgba([175, 230, 200], [195, 225, 240], bl, 1));
                g.addColorStop(1, lerpRgba([145, 215, 175], [170, 210, 232], bl, 1));
            } else {
                const bl = ctx2lerp(colorT, 0, .5);
                g = bgX.createRadialGradient(w * .42 + ox, h * .42 + oy, 0, w * .55, h * .52, w * .8);
                g.addColorStop(0, lerpRgba([210, 235, 248], [205, 245, 220], bl, 1));
                g.addColorStop(.5, lerpRgba([188, 222, 240], [175, 230, 200], bl, 1));
                g.addColorStop(1, lerpRgba([162, 205, 228], [145, 215, 175], bl, 1));
            }
            bgX.fillStyle = g; bgX.fillRect(0, 0, w, h);
        }
        function ctx2lerp(v, a, b) { return Math.max(0, Math.min(1, (v - a) / (b - a))) }
        function lerpRgba(a, b, t, alpha) {
            return `rgba(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')},${alpha})`;
        }
        window.addEventListener('resize', () => { resizeBg(); resizeOrb() });
        resizeBg();

        // ── ORB SETUP ────────────────────────────────────────────────────────
        const orbC = document.getElementById('drop');
        const ctx = orbC.getContext('2d');
        let OW, OH, CX, CY, R;
        function resizeOrb() {
            const wrap = document.getElementById('orb-wrap');
            const dpr = devicePixelRatio || 1;
            OW = orbC.width = wrap.offsetWidth * dpr;
            OH = orbC.height = wrap.offsetHeight * dpr;
            orbC.style.width = wrap.offsetWidth + 'px';
            orbC.style.height = wrap.offsetHeight + 'px';
            CX = OW / 2; CY = OH / 2; R = Math.min(OW, OH) * .38;
        }
        resizeOrb();

        // ── STATE ─────────────────────────────────────────────────────────────
        let colorT = 0, targetColor = 0;
        let rmsSmooth = 0;
        let wavePhase = 0, breathT = 0;
        const NPTS = 96;

        // color palettes [r,g,b]
        const P = {
            blueSpec: [235, 248, 255], blueBase: [170, 215, 245], blueMid: [115, 180, 230], blueDark: [70, 140, 210],
            greenSpec: [225, 252, 238], greenBase: [165, 235, 195], greenMid: [100, 200, 150], greenDark: [55, 160, 108]
        };
        function lerp3(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t) }
        function rgb3(c) { return `rgb(${c.map(Math.round).join(',')})` }
        function rgba3(c, a) { return `rgba(${c.map(Math.round).join(',')},${a.toFixed(3)})` }

        // ── DRAW ─────────────────────────────────────────────────────────────
        function buildPath(amp) {
            ctx.beginPath();
            for (let i = 0; i <= NPTS; i++) {
                const a = (i / NPTS) * Math.PI * 2;
                const w1 = amp * 0.13 * Math.sin(3 * a + wavePhase);
                const w2 = amp * 0.07 * Math.sin(5 * a - wavePhase * 1.4);
                const w3 = amp * 0.04 * Math.sin(7 * a + wavePhase * .8);
                const w4 = amp * 0.02 * Math.sin(11 * a - wavePhase * .5);
                const br = 0.022 * Math.sin(breathT);
                const dr = R * (1 + br + w1 + w2 + w3 + w4);
                const x = CX + Math.cos(a) * dr, y = CY + Math.sin(a) * dr;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath();
        }

        function drawOrb(amp) {
            ctx.clearRect(0, 0, OW, OH);
            const t = colorT;
            const spec = lerp3(P.blueSpec, P.greenSpec, t);
            const base = lerp3(P.blueBase, P.greenBase, t);
            const mid = lerp3(P.blueMid, P.greenMid, t);
            const dark = lerp3(P.blueDark, P.greenDark, t);

            // ── 1. outer glow ──
            const ogR = R * 1.6;
            const og = ctx.createRadialGradient(CX, CY, R * .8, CX, CY, ogR);
            og.addColorStop(0, rgba3(mid, .16 + amp * .14));
            og.addColorStop(.5, rgba3(base, .06 + amp * .05));
            og.addColorStop(1, rgba3(base, 0));
            ctx.beginPath(); ctx.arc(CX, CY, ogR, 0, Math.PI * 2);
            ctx.fillStyle = og; ctx.fill();

            // ── 2. blob body ──
            buildPath(amp);
            const bg = ctx.createRadialGradient(CX - R * .28, CY - R * .28, R * .04, CX + R * .1, CY + R * .12, R * 1.05);
            bg.addColorStop(0, rgba3(spec, .88));
            bg.addColorStop(.18, rgba3(base, .72));
            bg.addColorStop(.5, rgba3(mid, .52));
            bg.addColorStop(.82, rgba3(dark, .32));
            bg.addColorStop(1, rgba3(dark, .18));
            ctx.fillStyle = bg; ctx.fill();

            // ── 3. inner caustic volume ──
            ctx.save(); buildPath(amp); ctx.clip();
            const cg = ctx.createRadialGradient(CX - R * .15, CY - R * .2, R * .02, CX + R * .08, CY + R * .1, R * .9);
            cg.addColorStop(0, rgba3(spec, .55));
            cg.addColorStop(.25, rgba3(base, .18));
            cg.addColorStop(.6, rgba3(mid, .09));
            cg.addColorStop(1, rgba3(dark, .25));
            ctx.fillStyle = cg; ctx.fillRect(0, 0, OW, OH);
            ctx.restore();

            // ── 4. refraction shimmer bands ──
            ctx.save(); buildPath(amp); ctx.clip();
            for (let i = 0; i < 3; i++) {
                const ang = -Math.PI * .35 + i * .28 + amp * .15 * Math.sin(breathT + i);
                const bx = CX + Math.cos(ang) * R * .55, by = CY + Math.sin(ang) * R * .55;
                const bg2 = ctx.createRadialGradient(bx, by, 0, bx, by, R * .32);
                bg2.addColorStop(0, rgba3(spec, .12));
                bg2.addColorStop(1, rgba3(spec, 0));
                ctx.fillStyle = bg2; ctx.fillRect(0, 0, OW, OH);
            }
            ctx.restore();

            // ── 5. main specular ──
            ctx.save(); buildPath(amp); ctx.clip();
            const hx = CX - R * .37, hy = CY - R * .41;
            const hl = ctx.createRadialGradient(hx, hy, 0, hx, hy, R * .44);
            hl.addColorStop(0, 'rgba(255,255,255,.92)');
            hl.addColorStop(.28, 'rgba(255,255,255,.38)');
            hl.addColorStop(.6, 'rgba(255,255,255,.09)');
            hl.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = hl; ctx.fillRect(0, 0, OW, OH);
            ctx.restore();

            // ── 6. secondary specular ──
            ctx.save(); buildPath(amp); ctx.clip();
            const hx2 = CX + R * .3, hy2 = CY + R * .28;
            const hl2 = ctx.createRadialGradient(hx2, hy2, 0, hx2, hy2, R * .19);
            hl2.addColorStop(0, 'rgba(255,255,255,.45)');
            hl2.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = hl2; ctx.fillRect(0, 0, OW, OH);
            ctx.restore();

            // ── 7. rim ──
            buildPath(amp);
            ctx.strokeStyle = rgba3(spec, .72 + amp * .22);
            ctx.lineWidth = (1.8) * (devicePixelRatio || 1);
            ctx.stroke();

            // ── 8. audio ripple rings ──
            if (amp > 0.035) {
                for (let i = 0; i < 3; i++) {
                    const ph = ((wavePhase * .055 + i / 3) % 1);
                    const rr = R * (1.02 + ph * .62);
                    const ra = (1 - ph) * amp * .5;
                    ctx.beginPath(); ctx.arc(CX, CY, rr, 0, Math.PI * 2);
                    ctx.strokeStyle = rgba3(mid, ra);
                    ctx.lineWidth = (1.1) * (devicePixelRatio || 1);
                    ctx.stroke();
                }
            }
        }

        // ── AUDIO ────────────────────────────────────────────────────────────
        let analyser = null, dataArr = null, audioCtx2 = null, audioProc = null, audioSrc2 = null, micStream = null, micOn = false;

        async function startMic() {
            if (micOn) return;
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioCtx2 = new AudioContext({ sampleRate: 16000 });
                analyser = audioCtx2.createAnalyser(); analyser.fftSize = 512;
                dataArr = new Uint8Array(analyser.frequencyBinCount);
                audioSrc2 = audioCtx2.createMediaStreamSource(micStream);
                audioSrc2.connect(analyser);
                audioProc = audioCtx2.createScriptProcessor(4096, 1, 1);
                audioProc.onaudioprocess = (e) => {
                    if (ws?.readyState !== WebSocket.OPEN) return;
                    const inp = e.inputBuffer.getChannelData(0);
                    const p = new Int16Array(inp.length);
                    for (let i = 0; i < inp.length; i++)p[i] = Math.max(-1, Math.min(1, inp[i])) * 32767;
                    const pkt = new Uint8Array(1 + p.buffer.byteLength);
                    pkt[0] = 0x00; pkt.set(new Uint8Array(p.buffer), 1);
                    ws.send(pkt.buffer);
                };
                analyser.connect(audioProc); audioProc.connect(audioCtx2.destination);
                micOn = true; document.getElementById('btnMic').classList.add('on');
            } catch (e) { console.error(e) }
        }
        function stopMic() {
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioCtx2) audioCtx2.close();
            analyser = null; dataArr = null; micOn = false;
            document.getElementById('btnMic').classList.remove('on');
        }
        function getRms() {
            if (!analyser || !dataArr) return 0;
            analyser.getByteFrequencyData(dataArr);
            let s = 0; for (const v of dataArr) s += v * v;
            return Math.sqrt(s / dataArr.length) / 128;
        }

        // ── PLAYBACK ─────────────────────────────────────────────────────────
        let pbCtx = null, nextPbT = 0;
        function playPcm(buf) {
            if (!pbCtx) return;
            const i16 = new Int16Array(buf.byteLength % 2 === 0 ? buf : buf.slice(0, -1));
            const f32 = new Float32Array(i16.length);
            for (let i = 0; i < i16.length; i++)f32[i] = i16[i] / 32768;
            const ab = pbCtx.createBuffer(1, f32.length, 24000);
            ab.getChannelData(0).set(f32);
            const src = pbCtx.createBufferSource();
            src.buffer = ab; src.connect(pbCtx.destination);
            const now = pbCtx.currentTime;
            if (nextPbT < now) nextPbT = now;
            src.start(nextPbT); nextPbT += ab.duration;
            src.onended = () => { if (Math.abs(pbCtx.currentTime - nextPbT) < .06) setSpeaking(false); };
        }

        // ── WEBSOCKET ─────────────────────────────────────────────────────────
        let ws = null;
        function connectWs(wsUrl, token) {
            ws = new WebSocket(`${wsUrl}/ws/agent/live/?token=${encodeURIComponent(token)}`);
            ws.binaryType = 'arraybuffer';
            ws.onopen = () => {
                document.getElementById('conn').classList.add('on');
                setStatus('listening', '');
                pbCtx = pbCtx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                startMic();
            };
            ws.onmessage = (ev) => {
                if (ev.data instanceof ArrayBuffer) {
                    const t = new DataView(ev.data).getUint8(0), p = ev.data.slice(1);
                    if (t === 0x00) { playPcm(p); setSpeaking(true); }
                    else if (t === 0x02) handleJson(JSON.parse(new TextDecoder().decode(p)));
                    else if (t === 0x03) handleInterrupt();
                } else handleJson(JSON.parse(ev.data));
            };
            ws.onclose = () => {
                document.getElementById('conn').classList.remove('on');
                setStatus('disconnected', ''); stopMic(); stopCam();
            };
        }
        function handleInterrupt() {
            if (pbCtx) { pbCtx.close().then(() => { pbCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 }); nextPbT = 0 }); }
            setSpeaking(false);
        }
        function handleJson(m) {
            if (m.type === 'text') {
                document.getElementById('ticker').textContent = m.content;
                document.getElementById('ticker').className = 'ai';
                setSpeaking(true);
            }
        }

        // ── UI ────────────────────────────────────────────────────────────────
        function setSpeaking(v) {
            targetColor = v ? 1 : 0;
            const el = document.getElementById('status');
            el.textContent = v ? 'responding' : 'listening';
            el.className = v ? 'speak' : '';
        }
        function setStatus(txt, cls) {
            const el = document.getElementById('status'); el.textContent = txt; el.className = cls;
        }

        // ── CAMERA ────────────────────────────────────────────────────────────
        let vidStream = null, frameIv = null, camOn = false, camVis = false;
        const elVid = document.getElementById('localVideo');
        const elHC = document.getElementById('hiddenCanvas');
        const hcCtx = elHC.getContext('2d');
        async function startCam() {
            if (camOn) return;
            try {
                vidStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                elVid.srcObject = vidStream;
                elVid.onloadedmetadata = () => {
                    elHC.width = elVid.videoWidth; elHC.height = elVid.videoHeight;
                    frameIv = setInterval(() => {
                        if (ws?.readyState !== WebSocket.OPEN) return;
                        hcCtx.drawImage(elVid, 0, 0);
                        elHC.toBlob(blob => {
                            blob.arrayBuffer().then(ab => {
                                const p = new Uint8Array(1 + ab.byteLength); p[0] = 0x01; p.set(new Uint8Array(ab), 1);
                                ws.send(p.buffer);
                            });
                        }, 'image/jpeg', .8);
                    }, 1000);
                }; camOn = true;
            } catch (e) { console.error(e) }
        }
        function stopCam() {
            if (vidStream) vidStream.getTracks().forEach(t => t.stop());
            clearInterval(frameIv); camOn = false;
        }
        function toggleCamView() {
            camVis = !camVis;
            document.getElementById('cam-box').classList.toggle('hide', !camVis);
            document.getElementById('btnCam').classList.toggle('on', camVis);
        }

        document.getElementById('btnMic').addEventListener('click', () => micOn ? stopMic() : startMic());
        document.getElementById('btnCam').addEventListener('click', () => { if (!camOn) startCam(); toggleCamView(); });

        // ── LOOP ──────────────────────────────────────────────────────────────
        function loop(ts) {
            requestAnimationFrame(loop);
            const rms = getRms();
            rmsSmooth += (rms - rmsSmooth) * .16;
            const amp = Math.min(rmsSmooth * 2.5, 1);
            colorT += (targetColor - colorT) * .035;
            breathT += .014;
            wavePhase += .038 + amp * .09;
            drawBg(ts);
            drawOrb(amp);
        }
        requestAnimationFrame(loop);

        // ── ENTRY ─────────────────────────────────────────────────────────────
        window.startSession = function (token, wsUrl) {
            connectWs(wsUrl || 'wss://backend.hellocarepal.com', token);
            setTimeout(startCam, 800);
        };
        (() => {
            const p = new URLSearchParams(location.search);
            const tok = p.get('token'), w = p.get('ws');
            if (tok) window.startSession(tok, w || undefined);
        })();
    </script>
</body>

</html>
